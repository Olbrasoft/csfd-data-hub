name: Daily ČSFD scrape

on:
  schedule:
    # 03:00 UTC = 04:00 CET / 05:00 CEST — low-traffic window for ČSFD
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without writing files (preview only)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run scraper
        env:
          REQUEST_DELAY_MS: '2500'
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: npm run scrape

      - name: Commit data changes
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "csfd-data-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            DATE=$(date -u +'%Y-%m-%d')
            git commit -m "data: daily snapshot $DATE"
            git push
          fi
